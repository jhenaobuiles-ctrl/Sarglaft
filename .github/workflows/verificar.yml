name: Pruebas

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # El proyecto no tiene dependencias: no hay npm install que hacer.
      - name: Ejecutar pruebas
        run: node --test
