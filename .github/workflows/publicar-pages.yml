name: Publicar el panel

on:
  push:
    branches: [claude/sarglaft-consultas-listas-vfjvmu]
  # El bot que actualiza las listas empuja con GITHUB_TOKEN, y esos commits no
  # disparan `push`. Sin este gancho el sitio seguiría sirviendo las listas del
  # día que se publicó por última vez un cambio de código.
  workflow_run:
    workflows: ['Actualizar listas restrictivas']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca dos despliegues a la vez, pero sin cancelar el que ya va en curso:
# a medio publicar el sitio quedaría con archivos de dos versiones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Se publica solo lo que el sitio necesita. Los scripts de descarga y la
      # configuración de Actions no son parte del panel.
      - name: Preparar el sitio
        run: |
          mkdir -p sitio
          cp index.html sw.js sitio/
          cp -r app data sitio/
          # Con despliegue por Actions no corre Jekyll, pero el archivo no
          # cuesta nada y evita sorpresas si algún día se sirve desde la rama.
          touch sitio/.nojekyll
          echo "Publicando $(du -sh sitio | cut -f1):"
          find sitio -type f | wc -l | xargs echo "  archivos:"
          du -sh sitio/data | xargs echo "  listas:"

      # El GITHUB_TOKEN de Actions puede desplegar en Pages, pero no puede
      # crear el sitio: eso exige permisos de administrador del repositorio.
      # Se comprueba primero para que, si falta el interruptor, el fallo diga
      # qué hacer en vez de un "Resource not accessible by integration".
      - name: Comprobar que Pages está activado
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.info(`Pages activo. Origen: ${data.build_type}. URL: ${data.html_url}`);
              // Si eligieron servir desde una rama, Pages publica solo y este
              // flujo sobra. Se sale sin desplegar y sin marcar el trabajo en
              // rojo: la elección es válida, simplemente no nos necesita.
              if (data.build_type !== 'workflow') {
                core.setOutput('desplegar', 'no');
                await core.summary
                  .addRaw([
                    '## El sitio se publica desde la rama',
                    '',
                    `Pages está activo y sirviendo desde \`${data.build_type}\`, no por Actions.`,
                    `El panel está en ${data.html_url}`,
                    '',
                    'Este flujo no despliega nada en ese modo. Para que despliegue,',
                    'cambiar **Source** a **GitHub Actions**; si no, se puede borrar.',
                  ].join('\n'))
                  .write();
                return;
              }
              core.setOutput('desplegar', 'si');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const pasos = [
              '## Falta activar GitHub Pages',
              '',
              'Una persona con permisos de administrador tiene que hacerlo una sola vez:',
              '',
              `1. Abrir ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/settings/pages`,
              '2. En **Source**, elegir **GitHub Actions**.',
              '',
              'Nada más. Al guardar, este mismo flujo publica el panel y deja el enlace aquí.',
              'No hace falta elegir rama ni carpeta: de eso se encarga este archivo.',
            ].join('\n');
            await core.summary.addRaw(pasos).write();
            core.setFailed('GitHub Pages no está activado en este repositorio. Ver el resumen del trabajo para los dos pasos.');

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.desplegar == 'si'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.desplegar == 'si'
        with:
          path: sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
        if: steps.pages.outputs.desplegar == 'si'

      - name: Enlace del panel
        if: steps.pages.outputs.desplegar == 'si'
        run: |
          echo "### Panel publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.despliegue.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
